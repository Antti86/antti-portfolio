services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_db
    ports:
      - '5433:5432'
    volumes:
      # 1) persistent DB data
      - postgres_data:/var/lib/postgresql/data

      # 2) init scripts (run only when database is first created)
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio_db']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
